<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zuko — character preview</title>
    <style>
      body { margin: 0; padding: 12px 16px; background: #15161a; font: 11px system-ui, sans-serif; color: #c9ccd3; }
      h2 { margin: 10px 0 6px; font: 600 12px system-ui; color: #8f95a3; text-transform: uppercase; letter-spacing: 0.06em; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; }
      figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; }
      figcaption { font: 500 10px ui-monospace, monospace; color: #8a8f9c; }
      canvas { display: block; background: #000; border-radius: 10px; }
      .light canvas, canvas.light { background: #eef0f4; }
      .icons img { image-rendering: pixelated; display: block; }
      .tile { padding: 6px; border-radius: 8px; display: flex; gap: 8px; align-items: center; }
      .tile.l { background: #f3f4f7; } .tile.d { background: #202227; } .tile.m { background: #6b7280; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./character-preview.ts"></script>
  </body>
</html>
